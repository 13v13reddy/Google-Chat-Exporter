<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Google Chat Exporter</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="popup-body">
  <header class="app-header">Chat Exporter</header>
  <main>
    <h1 class="conversation" id="conv-name">Google Chat</h1>
    <p class="error" id="connection-error" role="alert" hidden></p>

    <section class="status-area" id="status-area" role="status" aria-live="polite">
      <div class="job-name" id="job-name" hidden></div>
      <span id="status-text"></span>
      <div class="progress-track" id="progress-track" role="progressbar" aria-label="Export progress" aria-valuemin="0" aria-valuemax="100">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <div class="job-controls" id="job-controls" hidden>
        <button type="button" id="return-to-chat">Return to Chat</button>
        <button type="button" id="cancel-export">Cancel</button>
        <button class="icon-button" type="button" id="dismiss-status" aria-label="Dismiss export status" title="Dismiss">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>
    </section>
    <div id="export-result" hidden></div>

    <div class="fields">
      <div class="field">
        <label for="format-select">Format</label>
        <select id="format-select">
          <option value="txt">Text (.txt)</option>
          <option value="md">Markdown (.md)</option>
          <option value="html">HTML</option>
        </select>
      </div>
      <div class="field">
        <label for="range-select">Messages</label>
        <select id="range-select">
          <option value="all">All messages and replies</option>
          <option value="since">Since a date…</option>
          <option value="new">New since last export</option>
          <option value="visible">Loaded messages only</option>
          <option value="visible-since">Loaded since a date…</option>
        </select>
      </div>
      <div class="field" id="date-row" hidden>
        <label for="date-from">From</label>
        <input type="date" id="date-from" disabled>
      </div>
    </div>
    <label class="check-row" id="media-row" hidden>
      <input type="checkbox" id="include-media" checked disabled>
      Download attachments
    </label>
    <p class="error" id="settings-error" role="alert" hidden></p>
    <button class="primary export-btn" id="export-btn" type="button" disabled>Export</button>

    <details class="options">
      <summary>Options</summary>
      <label class="check-row"><input type="checkbox" id="export-mode">Auto-export on open</label>
      <label class="check-row"><input type="checkbox" id="dark-mode">Dark mode</label>
    </details>
    <p class="error" id="theme-error" role="alert" hidden></p>
  </main>
  <script src="theme.js"></script>
  <script src="result-host.js"></script>
  <script src="popup.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Export result</title>
  <style>
    * { box-sizing: border-box; }
    html { color-scheme: light; background: transparent; --surface: #fff; --text: #202124; --secondary: #3c4043; --muted: #5f6368; --border: #dadce0; --hover: #f1f3f4; --accent: #1a73e8; --accent-hover: #1558b0; --on-accent: #fff; --error: #b3261e; --disabled: #e8eaed; }
    html[data-gce-theme="dark"] { color-scheme: dark; --surface: #202124; --text: #e8eaed; --secondary: #d2d5da; --muted: #bdc1c6; --border: #5f6368; --hover: #35363a; --accent: #8ab4f8; --accent-hover: #aecbfa; --on-accent: #202124; --error: #f28b82; --disabled: #3c4043; }
    body { margin: 0; padding: 4px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: var(--text); }
    .result { padding: 14px 16px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); }
    .heading { display: flex; align-items: center; gap: 8px; }
    h1 { margin: 0; flex: 1; font-size: 13px; font-weight: 600; }
    .close { display: grid; place-items: center; width: 28px; height: 28px; padding: 4px; border: 0; border-radius: 4px; background: transparent; color: var(--muted); cursor: pointer; }
    .close:hover { color: var(--text); background: var(--hover); }
    .filename { margin: 4px 0 0; font-size: 12px; line-height: 1.5; color: var(--secondary); overflow-wrap: anywhere; }
    .notice { margin: 8px 0 0; font-size: 12px; line-height: 1.5; color: var(--muted); overflow-wrap: anywhere; }
    #error { color: var(--error); }
    .actions { display: flex; justify-content: flex-end; margin-top: 12px; }
    .open { min-width: 64px; min-height: 32px; padding: 6px 16px; border: 0; border-radius: 6px; background: var(--accent); color: var(--on-accent); font: 600 12px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; cursor: pointer; }
    .open:hover { background: var(--accent-hover); }
    .open:disabled { background: var(--disabled); color: var(--muted); cursor: default; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <section class="result" aria-labelledby="heading">
    <div class="heading">
      <h1 id="heading" aria-live="polite">Saving export…</h1>
      <button class="close" id="close" type="button" aria-label="Dismiss export notification" title="Dismiss">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <p class="filename" id="filename"></p>
    <p class="notice" id="warning" hidden></p>
    <p class="notice" id="next" hidden>Auto-export: open the next channel.</p>
    <p class="notice" id="error" role="alert" hidden></p>
    <div class="actions"><button class="open" id="open" type="button" disabled>Open</button></div>
  </section>
  <script src="theme.js"></script>
  <script src="export-result.js"></script>
</body>
</html>

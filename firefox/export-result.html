<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Export result</title>
  <style>
    * { box-sizing: border-box; }
    html { color-scheme: light; background: transparent; }
    body { margin: 0; padding: 4px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #202124; }
    .result { padding: 14px 16px; border: 1px solid #dadce0; border-radius: 14px; background: #fff; }
    .heading { display: flex; align-items: center; gap: 8px; }
    h1 { margin: 0; flex: 1; font-size: 13px; font-weight: 600; }
    .close { display: grid; place-items: center; width: 28px; height: 28px; padding: 4px; border: 0; border-radius: 4px; background: transparent; color: #5f6368; cursor: pointer; }
    .close:hover { color: #202124; background: #f1f3f4; }
    .filename { margin: 4px 0 0; font-size: 12px; line-height: 1.5; color: #3c4043; overflow-wrap: anywhere; }
    .notice { margin: 8px 0 0; font-size: 12px; line-height: 1.5; color: #5f6368; overflow-wrap: anywhere; }
    #error { color: #b3261e; }
    .actions { display: flex; justify-content: flex-end; margin-top: 12px; }
    .open { min-width: 64px; min-height: 32px; padding: 6px 16px; border: 0; border-radius: 6px; background: #1a73e8; color: #fff; font: 600 12px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; cursor: pointer; }
    .open:hover { background: #1558b0; }
    .open:disabled { background: #e8eaed; color: #5f6368; cursor: default; }
    button:focus-visible { outline: 2px solid #174ea6; outline-offset: 2px; }
  </style>
</head>
<body>
  <section class="result" aria-labelledby="heading">
    <div class="heading">
      <h1 id="heading" aria-live="polite">Saving export…</h1>
      <button class="close" id="close" type="button" aria-label="Dismiss export notification" title="Dismiss">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <p class="filename" id="filename"></p>
    <p class="notice" id="warning" hidden></p>
    <p class="notice" id="next" hidden>Auto-export: open the next channel.</p>
    <p class="notice" id="error" role="alert" hidden></p>
    <div class="actions"><button class="open" id="open" type="button" disabled>Open</button></div>
  </section>
  <script src="export-result.js"></script>
</body>
</html>

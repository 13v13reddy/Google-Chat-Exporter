<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Export result</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="result-body">
  <section class="result" id="result-card" aria-labelledby="heading">
    <div class="result-heading">
      <h1 id="heading" aria-live="polite">Saving export…</h1>
      <button id="close" type="button" aria-label="Dismiss export notification">Dismiss</button>
    </div>
    <p class="filename" id="filename"></p>
    <p class="notice" id="warning" hidden></p>
    <p class="notice" id="error" role="alert" hidden></p>
    <div class="actions"><button class="primary" id="open" type="button" disabled>Open file</button></div>
  </section>
  <script src="theme.js"></script>
  <script src="export-result.js"></script>
</body>
</html>
